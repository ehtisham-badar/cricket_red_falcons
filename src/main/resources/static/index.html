<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Red Falcons Ledger</title>
  <meta name="description" content="Red Falcons Cricket Club — training, match and payment ledger.">
  <meta name="theme-color" content="#121215">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Red Falcons">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>/* Apply the saved theme before first paint. */try{var t=JSON.parse(localStorage.getItem('rf.theme'));if(t&&t!=='night')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>

<!-- Loading screen: shown until the ledger has loaded (or the start screen is needed) -->
<div id="loader" class="loader" role="status" aria-live="polite">
  <div class="loader-glow" aria-hidden="true"></div>
  <div class="loader-crest">
    <span class="loader-ring" aria-hidden="true"></span>
    <img class="loader-logo" src="img/logo.jpeg" alt="Red Falcons Cricket Club crest">
  </div>
  <div class="loader-name">Red Falcons</div>
  <div class="loader-sub">Cricket Club</div>
  <div class="loader-bar" aria-hidden="true"><span></span></div>
  <p id="loader-text" class="loader-text">Loading the ledger…</p>
</div>

<!-- Start screen -->
<section id="splash" class="splash" hidden>
  <div class="splash-glow" aria-hidden="true"></div>
  <div class="splash-inner">
    <img class="splash-logo" src="img/logo.jpeg" alt="Red Falcons Cricket Club crest">
    <h1 class="wordmark">Red Falcons</h1>
    <p class="tagline">Cricket Club &middot; Team Ledger</p>

    <form id="login-form" class="login" autocomplete="off">
      <button type="button" id="continue-btn" class="btn btn-ghost continue" hidden></button>
      <label for="login-name" class="login-label">Enter your name</label>
      <div class="login-row">
        <input id="login-name" name="name" type="text" maxlength="60" placeholder="Your name" autocapitalize="words" spellcheck="false" required>
        <button type="submit" class="btn btn-primary">Enter</button>
      </div>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>

    <!-- Second step for the admin when two-factor is on -->
    <form id="code-form" class="login code-step" autocomplete="off" hidden>
      <label for="login-code" class="login-label">Code from your authenticator app</label>
      <div class="login-row">
        <input id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="123 456" spellcheck="false" required>
        <button type="submit" class="btn btn-primary">Verify</button>
      </div>
      <label class="trust-row"><input id="login-trust" type="checkbox" checked> Trust this browser — don’t ask again here</label>
      <p class="code-hint">Lost your phone? Type one of your recovery codes instead.</p>
      <p id="code-error" class="login-error" role="alert"></p>
      <button type="button" id="code-back" class="btn btn-ghost small">Back</button>
    </form>
  </div>
</section>

<!-- Main app -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <img src="img/logo.jpeg" alt="" class="brand-logo">
      <div class="brand-text">
        <span class="brand-name">Red Falcons</span>
        <span class="brand-sub">Cricket Club Ledger</span>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="who">
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <span id="who-badge" class="who-badge"></span>
      <button class="icon-btn bell" id="bell" data-action="open-inbox" title="Notifications" aria-label="Notifications" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button class="icon-btn" data-action="logout" title="Switch user" aria-label="Switch user">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>
</div>

<div id="sheet-root"></div>
<datalist id="hpl-teams"><option value="Pak 11"><option value="Anggler"><option value="Rage Rovers"><option value="Raptors"><option value="Galacticos"></datalist>
<div id="dialog-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<input type="file" id="photo-file" accept="image/*" hidden>
<input type="file" id="gallery-file" accept="image/*" multiple hidden>

<script src="js/config.js"></script>
<script src="js/calc.js"></script>
<script src="js/balance-image.js"></script>
<script src="js/app.js"></script>
</body>
</html>
