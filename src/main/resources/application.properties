spring.application.name=red-falcons-ledger
server.port=${PORT:8080}

# Secret admin key: typing this on the start screen unlocks editing. Required, with no default,
# so it never lives in git. Set the LEDGER_ADMIN_KEY env var, or for local runs put
# ledger.admin-key=... in config/application.properties (git-ignored).
ledger.admin-key=${LEDGER_ADMIN_KEY:}

# Comma-separated origins allowed to call the API (only needed when the UI is hosted elsewhere).
ledger.allowed-origins=${LEDGER_ALLOWED_ORIGINS:}

# File database. LEDGER_DATA_DIR picks the folder (e.g. a Railway Volume mount path); defaults to ./data.
spring.datasource.url=jdbc:h2:file:${LEDGER_DATA_DIR:./data}/redfalcons;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Web push (VAPID) keys, base64url. Without them notifications are switched off.
ledger.vapid-public=${LEDGER_VAPID_PUBLIC:}
ledger.vapid-private=${LEDGER_VAPID_PRIVATE:}

# Set LEDGER_RESET_2FA=true and restart to turn the admin's two-factor sign-in off (lost phone and codes).
ledger.reset-2fa=${LEDGER_RESET_2FA:false}

# The Hundred Premier League's public page on Crickslab (points table, results, top players). Empty turns it off.
ledger.hpl-url=${LEDGER_HPL_URL:https://crickslab.com/match-central/tournament-details/14567/hundred-premier-league/9e66c220-c896-11f1-8c76-4172a5951fad/overview}

# The app's files are checked for a new version on every load (they are small and served with an ETag), so a
# deploy shows up straight away instead of after the browser's own cache expires.
spring.web.resources.cache.cachecontrol.no-cache=true
