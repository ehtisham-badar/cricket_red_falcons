spring.application.name=red-falcons-ledger
server.port=${PORT:8080}

# Secret admin key: typing this on the start screen unlocks editing. Required, with no default,
# so it never lives in git. Set the LEDGER_ADMIN_KEY env var, or for local runs put
# ledger.admin-key=... in config/application.properties (git-ignored).
ledger.admin-key=${LEDGER_ADMIN_KEY:}

# Comma-separated origins allowed to call the API (only needed when the UI is hosted elsewhere).
ledger.allowed-origins=${LEDGER_ALLOWED_ORIGINS:}

# File database. LEDGER_DATA_DIR picks the folder (e.g. a Railway Volume mount path); defaults to ./data.
spring.datasource.url=jdbc:h2:file:${LEDGER_DATA_DIR:./data}/redfalcons;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
