spring.application.name=red-falcons-ledger
server.port=${PORT:8080}

# Secret admin key: typing this on the start screen unlocks editing.
# Override without editing this file:  LEDGER_ADMIN_KEY=something ./mvnw spring-boot:run
ledger.admin-key=${LEDGER_ADMIN_KEY:hellopanda}

# Comma-separated origins allowed to call the API (only needed when the UI is hosted elsewhere).
ledger.allowed-origins=${LEDGER_ALLOWED_ORIGINS:}

# Local file database, stored in ./data next to the project.
spring.datasource.url=jdbc:h2:file:./data/redfalcons;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
